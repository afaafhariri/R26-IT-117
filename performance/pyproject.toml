[project]
name = "performance"
version = "0.1.0"
description = "R26-IT-117 Component 04: performance monitoring and delay prediction"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask==3.1.3",
    "flask-cors==6.0.5",
    "psycopg2-binary==2.9.9",
    "numpy==1.26.2",
    "scikit-learn==1.6.1",
    "xgboost-cpu==3.2.0; sys_platform != 'darwin'",
    "xgboost==3.2.0; sys_platform == 'darwin'", # xgboost-cpu has no macOS arm64 wheel
    "faiss-cpu==1.8.0",
    "huggingface-hub==0.23.4",
    "tokenizers==0.19.1",
    "safetensors==0.4.3",
    # transformers 5.x needs tokenizers>=0.22 and does not resolve with the
    # pins here; 4.41.2 is the set that was in requirements.fixed.txt.
    "transformers==4.41.2",
    "sentence-transformers==5.6.0",
    # Pulled in by sentence-transformers; pinned here instead of only in the
    # Dockerfile so local and container match.
    "torch==2.3.1",
    "google-generativeai==0.3.2",
    "sqlalchemy==2.0.23",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
]
# Training only (train.py): not imported by the running Flask app.
# Install with `uv sync --group train`.
train = [
    "pandas==2.2.2",
    "imbalanced-learn==0.13.0",
    "scikit-optimize==0.10.2",
]

[tool.uv]
# An application, not a library: install its dependencies, not the project.
package = false

# Linux (Docker) gets the CPU-only torch build instead of the multi-GB CUDA one.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
