[project]
name = "cost-estimation"
version = "0.1.0"
description = "R26-IT-117 Component 02: cost estimation service"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Web framework
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.31",
    # Data validation
    "pydantic==2.11.3",
    # Data processing
    "pandas==2.2.3",
    "numpy==1.26.4",
    # ML: XGBoost
    "xgboost==2.1.4",
    "scikit-learn==1.6.1",
    "joblib==1.4.2",
    # Explainability
    "shap==0.46.0",
    # HTTP client (inter-component calls)
    "httpx==0.28.1",
    # Price scraper (scripts/scrape_stockpile.py)
    "beautifulsoup4==4.12.3",
    # Utilities
    "python-dotenv==1.2.2",
    "python-dateutil==2.9.0.post0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
]

[tool.uv]
# An application, not a library: install its dependencies, not the project.
package = false
