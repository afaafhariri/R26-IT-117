[project]
name = "gateway"
version = "0.1.0"
description = "R26-IT-117 API gateway: auth and the browser's single entry point"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.3",
    # Auth and database
    "sqlalchemy[asyncio]==2.1.1",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "email-validator==2.3.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv]
# An application, not a library: install its dependencies, not the project.
package = false
